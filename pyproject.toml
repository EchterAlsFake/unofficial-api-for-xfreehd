[build-system]
requires = ["uv_build>=0.9.30"]
build-backend = "uv_build"

[project]
name = "unofficial-api-for-xfreehd"
version = "1.7.4"
description = "An asynchronous Python API wrapper and scraper for xfreehd.com"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Johannes Habel", email = "EchterAlsFake@proton.me" }
]
keywords = [
    "api",
    "scraper",
    "async",
    "asyncio",
    "video-downloader",
    "selectolax",
    "curl-cffi",
    "xfreehd"
]

dependencies = [
    "selectolax",
    "eaf-base-api>=4.2.5",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Video"
]


[project.urls]
Documentation = "https://docs.echteralsfake.me/xfreehd"
Repository = "https://github.com/EchterAlsFake/unofficial-api-for-xfreehd"
"Bug Tracker" = "https://github.com/EchterAlsFake/unofficial-api-for-xfreehd/issues"
"Support me on Ko-Fi" = "https://ko-fi.com/EchterAlsFake"
"Donate via PayPal" = "https://paypal.me/EchterAlsFake"
"Donate via Crypto" = "https://nowpayments.io/donation/EchterAlsFake"

[project.scripts]
xfreehd_api = "xfreehd_api.api:main"

[tool.setuptools]
packages = { find = {} }

[tool.uv.build-backend]
module-name = "xfreehd_api"
module-root = ""

[dependency-groups]
dev = [
    "fastapi>=0.162.1",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "uvicorn[standard]>=0.54.0",
]
gui = [
    "httpx>=0.28.1",
    "unofficial-api-for-beeg>=1.7.4",
    "unofficial-api-for-missav>=2.6.2",
    "unofficial-api-for-xnxx>=2.4.4",
]
